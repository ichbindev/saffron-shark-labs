name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint (prettier)
        run: npm run lint

      - name: Typecheck (astro check)
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Runs against dist/, so it has to come after the build.
      - name: Test build output
        run: npm run test:build
